<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Branch Glow & Gradients -->
    <linearGradient id="mainBranch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="subBranch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <linearGradient id="featureBranch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Node Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#312E81" stroke-width="3" stroke-opacity="0.6" />

  <!-- Inner Soft Grid Accent -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="80" y1="0" x2="80" y2="512" />
    <line x1="160" y1="0" x2="160" y2="512" />
    <line x1="240" y1="0" x2="240" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="400" y1="0" x2="400" y2="512" />
    <line x1="0" y1="80" x2="512" y2="80" />
    <line x1="0" y1="160" x2="512" y2="160" />
    <line x1="0" y1="240" x2="512" y2="240" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="400" x2="512" y2="400" />
  </g>

  <!-- Git Graph Tracks / Edges -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Lane (Left vertical line) -->
    <path d="M 160 100 L 160 412" stroke="url(#mainBranch)" stroke-width="18" filter="url(#glow)" />

    <!-- Branch Fork & Merge 1 (Middle orange/pink) -->
    <path d="M 160 140 C 160 190, 290 190, 290 240 C 290 290, 160 290, 160 340" stroke="url(#subBranch)" stroke-width="16" />

    <!-- Branch Fork 2 (Right cyan/green) -->
    <path d="M 290 240 C 290 290, 390 290, 390 340 L 390 412" stroke="url(#featureBranch)" stroke-width="14" />
  </g>

  <!-- Git Nodes (Commits) -->
  <!-- Main Lane Commits -->
  <!-- Top Node -->
  <circle cx="160" cy="100" r="28" fill="#0F172A" stroke="#38BDF8" stroke-width="8" filter="url(#glow)" />
  <circle cx="160" cy="100" r="12" fill="#38BDF8" />

  <!-- Fork Origin Node -->
  <circle cx="160" cy="140" r="26" fill="#0F172A" stroke="#60A5FA" stroke-width="7" />
  <circle cx="160" cy="140" r="10" fill="#60A5FA" />

  <!-- Branch Commit Node -->
  <circle cx="290" cy="240" r="30" fill="#0F172A" stroke="#F43F5E" stroke-width="8" filter="url(#glow)" />
  <circle cx="290" cy="240" r="14" fill="#FB923C" />

  <!-- Merge Commit Node -->
  <circle cx="160" cy="340" r="32" fill="#0F172A" stroke="#818CF8" stroke-width="9" filter="url(#glow)" />
  <circle cx="160" cy="340" r="14" fill="#A855F7" />

  <!-- Bottom Main Node -->
  <circle cx="160" cy="412" r="26" fill="#0F172A" stroke="#6366F1" stroke-width="7" />
  <circle cx="160" cy="412" r="10" fill="#6366F1" />

  <!-- Feature Branch Node -->
  <circle cx="390" cy="340" r="26" fill="#0F172A" stroke="#10B981" stroke-width="7" filter="url(#glow)" />
  <circle cx="390" cy="340" r="10" fill="#34D399" />

  <!-- Feature Bottom Node -->
  <circle cx="390" cy="412" r="24" fill="#0F172A" stroke="#06B6D4" stroke-width="6" />
  <circle cx="390" cy="412" r="9" fill="#06B6D4" />
</svg>
