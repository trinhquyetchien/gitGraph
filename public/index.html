<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Git Graph Web Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Top Navigation Bar -->
      <header class="top-nav">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="6" cy="6" r="3" />
            <circle cx="6" cy="18" r="3" />
            <line x1="6" y1="9" x2="6" y2="15" />
            <circle cx="18" cy="9" r="3" />
            <path d="M6 18c0-3 3-6 6-6h3" />
          </svg>
          <span class="brand-title">Git Graph</span>
          <span class="brand-badge">PRO</span>
        </div>

        <form id="repo-form" class="repo-search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
            <path d="M22 19l-6-6" />
            <circle cx="10" cy="10" r="7" />
          </svg>
          <input id="repo-path" type="text" placeholder="Đường dẫn Git Repository hoặc .git..." autocomplete="off" spellcheck="false" />
          <button type="submit" class="primary-btn">Tải Repo</button>
        </form>

        <div class="top-actions">
          <button id="fetch-btn" class="action-btn" type="button" title="Fetch updates from remote">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Fetch
          </button>
          <button id="refresh-btn" class="action-btn" type="button" title="Reload repository">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M3 21v-5h5" />
            </svg>
            Refresh
          </button>
        </div>
      </header>

      <!-- Sub Toolbar -->
      <section class="toolbar">
        <div class="filter-controls">
          <div class="input-wrapper">
            <input id="commit-search" type="search" placeholder="Tìm theo hash, subject, author..." autocomplete="off" />
          </div>
          <label class="toggle-control">
            <input id="head-only-toggle" type="checkbox" />
            <span>Chỉ xem nhánh HEAD</span>
          </label>
        </div>
        <div id="repo-stats" class="repo-stats"></div>
      </section>

      <!-- Status Banner -->
      <div id="status-banner" class="status-banner loading">Đang tải dữ liệu repository...</div>

      <!-- Main Workspace (Split View) -->
      <main class="workspace">
        <!-- Left Panel: SVG Graph & Commits -->
        <section class="panel panel-graph">
          <div id="graph-empty" class="graph-empty hidden">
            <p>Không có commit nào để hiển thị.</p>
          </div>
          <div id="graph-scroll" class="graph-scroll">
            <svg id="graph-svg" role="img" aria-label="Git Commit Graph"></svg>
          </div>
        </section>

        <!-- Right Panel: Commit Details & Full Diff Viewer -->
        <aside class="panel panel-inspector">
          <div class="inspector-header">
            <h3>Chi tiết Commit</h3>
            <span id="selected-short-hash" class="hash-tag"></span>
          </div>

          <div id="inspector-content" class="inspector-content">
            <p class="placeholder-text">Chọn một commit ở bảng bên trái để xem chi tiết & git diff.</p>
          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
